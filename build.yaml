# This file generates the GitHub Actions matrix.
# Boards use the Zephyr 4.1 names with the ZMK variant (`<board>//zmk`).
#
# ZMK Studio runs only on the central part (the dongle, or the left half
# in the dongle-less setup), so only centrals get the studio snippet.
#
# The central processes the keymap, so it is built once per target OS
# (-DOS_MAC / -DOS_LINUX, see "Target OS" in config/corne.keymap) and the
# file name ends with the OS. Peripherals compile the keymap too but never
# use it (key presses are sent to the central), so they have one build for
# both systems; OS_LINUX there only satisfies the #error check.
---
include:
  # --- with dongle ---
  - board: nice_nano//zmk
    shield: corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_MAC
    artifact-name: corne_central_dongle-nice_nano_zmk-mac
  - board: nice_nano//zmk
    shield: corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_LINUX
    artifact-name: corne_central_dongle-nice_nano_zmk-linux
  - board: xiao_ble//zmk
    shield: corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_MAC
    artifact-name: corne_central_dongle-xiao_ble_zmk-mac
  - board: xiao_ble//zmk
    shield: corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_LINUX
    artifact-name: corne_central_dongle-xiao_ble_zmk-linux
  - board: nice_nano//zmk
    shield: corne_peripheral_left
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_LINUX
  - board: nice_nano//zmk
    shield: corne_peripheral_right
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_LINUX

  # --- without dongle: left half is central ---
  - board: nice_nano//zmk
    shield: corne_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_MAC
    artifact-name: corne_central_left-nice_nano_zmk-mac
  - board: nice_nano//zmk
    shield: corne_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DOS_LINUX
    artifact-name: corne_central_left-nice_nano_zmk-linux

  # --- reset bonded devices / settings ---
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
