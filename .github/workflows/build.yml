name: Compile ZMK
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "build.yaml"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "img/keymap-img/**"
      - ".github/workflows/build.yml"

jobs:
  test:
    name: Keymap tests
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    env:
      REPO: ${{ github.workspace }}
      WS: /ws
    steps:
      - uses: actions/checkout@v4
      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            /ws/modules
            /ws/zephyr
            /ws/zmk
            /ws/zmk-helpers
            /ws/.west
          key: west-${{ hashFiles('config/west.yml') }}-${{ github.run_id }}
          restore-keys: west-${{ hashFiles('config/west.yml') }}-
      - name: West workspace
        run: |
          mkdir -p /ws/config && cp config/west.yml /ws/config/west.yml
          cd /ws
          [ -d .west ] || west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Run keymap tests
        run: python3 tests/run_tests.py

  drawing:
    name: Keymap drawing is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install keymap-drawer (version pinned in scripts/draw-keymap.sh)
        run: pip install "keymap-drawer==$(sed -n 's/^VERSION="\(.*\)"/\1/p' scripts/draw-keymap.sh)"
      - name: Check drawing
        run: scripts/draw-keymap.sh --check

  build:
    needs: test
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
