# Deep sleep after 30 min without key presses on THIS half; a key press wakes
# it (kscan is a wakeup-source in corne.dtsi), it reboots and reconnects.
# A peripheral counts only its own keys (ZMK activity is local), so typing
# with the other hand alone does not keep it awake: longer than the central's
# 10 min, so that one-handed typing does not put it to sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
