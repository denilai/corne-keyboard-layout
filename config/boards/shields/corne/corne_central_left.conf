# Deep sleep after 10 min without key presses; a key press wakes the half
# (kscan is a wakeup-source in corne.dtsi), it reboots and reconnects.
# The central counts the right half's key presses too, so it does not sleep
# while either hand types.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# ZMK Studio: live keymap editing over USB (transport comes from the
# studio-rpc-usb-uart snippet in build.yaml)
CONFIG_ZMK_STUDIO=y
